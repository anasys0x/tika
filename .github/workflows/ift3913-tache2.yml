name: IFT3913 - Tache 2

on:
  push:
    branches: [tache2]
    paths:
      - 'tika-core/**'
      - 'tika-parent/**'
      - 'tika-annotation-processor/**'
      - 'ift3913/scripts/**'
      - '.github/workflows/ift3913-tache2.yml'
      - 'pom.xml'
  pull_request:
    branches: [main, tache2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Original, AI and manual tests with mutation comparison
        env:
          IFT3913_EVIDENCE_DIR: ${{ runner.temp }}/ift3913-evidence
        run: bash ift3913/scripts/measure.sh
      - name: Preserve test, coverage and mutation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ift3913-test-reports
          path: |
            tika-core/target/surefire-reports/
            tika-core/target/site/jacoco/
            ${{ runner.temp }}/ift3913-evidence/
