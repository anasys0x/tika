name: IFT3913 - Tache 2

on:
  push:
    branches: [tache2]
    paths:
      - 'tika-core/**'
      - 'tika-parent/**'
      - 'tika-annotation-processor/**'
      - '.github/workflows/ift3913-tache2.yml'
      - 'pom.xml'
  pull_request:
    branches: [main, tache2]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Execute original, AI and additional tests
        run: mvn -B -ntp -pl tika-core -am clean verify -Pci,ift3913-ai,ift3913-manual
